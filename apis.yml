name: Xirrus
description: Xirrus was an enterprise Wi-Fi company that made high-density wireless
  access points and arrays managed through the Xirrus Management System (XMS), which
  exposed a management API that community client libraries were built against. Backed
  by Canaan Partners, Xirrus was acquired by Riverbed Technology in April 2017 to
  power cloud-managed Wi-Fi in SteelConnect, and Riverbed sold the Xirrus Wi-Fi business
  to Cambium Networks in 2019. The Xirrus brand has since been absorbed into Cambium
  Networks' enterprise Wi-Fi portfolio, and xirrus.com now redirects to cambiumnetworks.com,
  leaving no independent Xirrus API surface.
