notes: Xirrus published no first-party client libraries on the public registries
  (npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist, crates.io were
  probed). The packages below are community-built clients for the legacy Xirrus XMS
  management API and Xirrus switches; the brand was absorbed into Cambium Networks
  in 2019 and no official SDKs remain.
